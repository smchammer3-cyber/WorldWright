name: C2A Structural-Role Research Package Gate

on:
  pull_request:
    branches:
      - WorldWright-new
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c2a-structural-role-research-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-role-research:
    name: Validate C2A sources, rules, fixtures, and review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run C2A research and artifact gates
        run: |
          mkdir -p artifacts/ci-logs artifacts/c2a-structural-role-research-package
          set -o pipefail
          npx vitest run test/causalContinentOceanStructureResearchPackage.spec.ts test/causalContinentOceanStructureC2AArtifact.spec.ts 2>&1 | tee artifacts/ci-logs/c2a-structural-role-research-package.log
          cp docs/implementation/phase-c/c2a-structural-role-research-package.json artifacts/c2a-structural-role-research-package/
          cp docs/implementation/PHASE_C2A_STRUCTURAL_ROLE_RESEARCH_PACKAGE_STATUS.md artifacts/c2a-structural-role-research-package/
          cp src/core/causalGeology/research/continent-ocean-structure-*.json artifacts/c2a-structural-role-research-package/

      - name: Summarize C2A gate
        if: always()
        run: |
          {
            echo "## Phase C2A structural-role research package"
            echo "- Sources: \`8\`"
            echo "- Generic reviewed claims: \`8\`"
            echo "- Role / ghost rules: \`10 / 5\`"
            echo "- Fixtures: \`16\`"
            echo "- Positive / threshold / negative / exception / holdout: \`4 / 7 / 2 / 1 / 2\`"
            echo "- COMPLETE-eligible rules: \`0\`"
            echo "- Scientific status: \`PARTIAL\`"
            echo "- Physical generator authority: \`LEGACY\`"
            echo "- Authorized next scope: \`C2B detached resolver only\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C2A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2a-structural-role-research-package
          path: |
            artifacts/c2a-structural-role-research-package/
            artifacts/ci-logs/c2a-structural-role-research-package.log
          if-no-files-found: warn
          retention-days: 30
