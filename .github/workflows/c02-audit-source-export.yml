name: C02 Audit Source Export

on:
  push:
    branches:
      - agent/c02-deterministic-seeds-flags-provenance

permissions:
  contents: read

jobs:
  export:
    if: contains(github.event.head_commit.message, '[c02-audit-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package exact source tree
        run: |
          set -euo pipefail
          git archive --format=zip --output=worldwright-c02-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: worldwright-c02-source
          path: worldwright-c02-source.zip
          if-no-files-found: error
          retention-days: 1
