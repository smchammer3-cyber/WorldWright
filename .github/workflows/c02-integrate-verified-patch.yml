name: C02 Integrate Verified Patch

on:
  push:
    branches:
      - agent/c02-deterministic-seeds-flags-provenance

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Run verified C02 patch integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out authoritative C02 branch
        uses: actions/checkout@v4
        with:
          ref: agent/c02-deterministic-seeds-flags-provenance
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .c02-patch/0* | tr -d '\n' | base64 -d > /tmp/c02-remaining.patch
          git apply --check /tmp/c02-remaining.patch
          git apply /tmp/c02-remaining.patch
          rm -rf .c02-patch

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run focused C02 acceptance suite
        run: >-
          npx vitest run
          test/worldRandomKnownVectors.spec.ts
          test/worldRandomIsolation.spec.ts
          test/worldRandomScopeEncoding.spec.ts
          test/worldFeatureFlags.spec.ts
          test/worldCanonicalHash.spec.ts
          test/worldProvenance.spec.ts
          test/worldEntropy.spec.ts
          test/worldSimDeterminism.spec.ts
          test/worldSessionMigration.spec.ts
          test/worldStageHashDeterminism.spec.ts
          test/worldC02OutputEquivalence.spec.ts
          test/mathRandomGuard.spec.ts
          src/core/worldStorage/simBranchRecords.test.ts
          --maxWorkers=2

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WorldWright C02 Integration'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Complete C02 deterministic foundation'
          git push origin HEAD:agent/c02-deterministic-seeds-flags-provenance
