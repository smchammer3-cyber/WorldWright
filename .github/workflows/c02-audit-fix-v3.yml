name: C02 Audit Fix V3

on:
  push:
    branches:
      - agent/c02-deterministic-seeds-flags-provenance

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[c02-audit-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c02-deterministic-seeds-flags-provenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply validation follow-ups
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new))

          replace_once(
              'src/core/worldStorage/index.ts',
              "      .map(normalizeSimBranchRecord);\n",
              "      .map((record) => normalizeSimBranchRecord(record, 'LOAD'));\n",
          )

          replace_once(
              'src/core/worldStorage/simBranchRecords.test.ts',
              "      ...selected!,\n      currentYear: 6,\n      worldSnapshot: {\n",
              "      ...selected!,\n      currentYear: 6,\n      randomContext: selected!.randomContext\n        ? { ...selected!.randomContext, tickIndex: selected!.randomContext.tickIndex + 1 }\n        : undefined,\n      worldSnapshot: {\n",
          )

          replace_once(
              'test/worldGenerateMultiSeedDiagnostics.spec.ts',
              "  it('keeps aggregate rankings deterministic', () => {\n    const a = runMultiSeedGenerateDiagnostics({ seeds, width: 64, height: 32 }).rankings;\n    const b = runMultiSeedGenerateDiagnostics({ seeds, width: 64, height: 32 }).rankings;\n    expect(a).toEqual(b);\n  });\n",
              "  it('keeps aggregate rankings deterministic', () => {\n    const a = runMultiSeedGenerateDiagnostics({ seeds, width: 64, height: 32 }).rankings;\n    const b = runMultiSeedGenerateDiagnostics({ seeds, width: 64, height: 32 }).rankings;\n    expect(a).toEqual(b);\n  }, 15_000);\n",
          )

          Path('docs/implementation/C02_AUDIT_VALIDATION_FAILURE.log').unlink(missing_ok=True)
          Path('.github/workflows/c02-audit-fix-v3.yml').unlink(missing_ok=True)
          PY
      - name: Validate corrected head
        id: validate
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            npm run test:run > /tmp/tests.log 2>&1
            test_status=$?
            npm run build > /tmp/build.log 2>&1
            build_status=$?
          else
            test_status=1
            build_status=1
            : > /tmp/tests.log
            : > /tmp/build.log
          fi
          cat /tmp/npm-ci.log
          cat /tmp/tests.log
          cat /tmp/build.log
          if [ "$install_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            {
              echo '=== npm ci ==='
              cat /tmp/npm-ci.log
              echo '=== tests ==='
              cat /tmp/tests.log
              echo '=== build ==='
              cat /tmp/build.log
            } > docs/implementation/C02_AUDIT_VALIDATION_FAILURE.log
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Publish validated follow-ups
        run: |
          set -euo pipefail
          git config user.name 'WorldWright C02 Audit'
          git config user.email 'actions@github.com'
          git add -A
          if [ "${{ steps.validate.outputs.failed }}" = 'true' ]; then
            git commit -m 'Refine C02 audit fixes with validation evidence'
          else
            git commit -m 'Validate C02 persisted replay audit fixes'
          fi
          git push origin HEAD:agent/c02-deterministic-seeds-flags-provenance
