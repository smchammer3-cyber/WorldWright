name: C02 Audit Fix V2

on:
  push:
    branches:
      - agent/c02-deterministic-seeds-flags-provenance

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[c02-audit-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c02-deterministic-seeds-flags-provenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch with durable failure report
        id: patch
        shell: bash
        run: |
          set +e
          python .github/scripts/c02_audit_fix.py > /tmp/c02-audit-patch.log 2>&1
          status=$?
          cat /tmp/c02-audit-patch.log
          if [ "$status" -ne 0 ]; then
            mkdir -p docs/implementation
            cp /tmp/c02-audit-patch.log docs/implementation/C02_AUDIT_FIX_FAILURE.log
            echo "patch_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "patch_failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Validate corrected source
        id: validate
        if: steps.patch.outputs.patch_failed == 'false'
        shell: bash
        run: |
          set +e
          npm ci > /tmp/c02-npm-ci.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            npm run test:run > /tmp/c02-tests.log 2>&1
            test_status=$?
            npm run build > /tmp/c02-build.log 2>&1
            build_status=$?
          else
            test_status=1
            build_status=1
            : > /tmp/c02-tests.log
            : > /tmp/c02-build.log
          fi
          cat /tmp/c02-npm-ci.log
          cat /tmp/c02-tests.log
          cat /tmp/c02-build.log
          if [ "$install_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            mkdir -p docs/implementation
            {
              echo '=== npm ci ==='
              cat /tmp/c02-npm-ci.log
              echo '=== tests ==='
              cat /tmp/c02-tests.log
              echo '=== build ==='
              cat /tmp/c02-build.log
            } > docs/implementation/C02_AUDIT_VALIDATION_FAILURE.log
            echo "validation_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "validation_failed=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Publish patch or diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WorldWright C02 Audit'
          git config user.email 'actions@github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes were produced.'
            exit 1
          fi
          if [ "${{ steps.patch.outputs.patch_failed }}" = 'true' ]; then
            git commit -m 'Record C02 audit patch failure'
          elif [ "${{ steps.validate.outputs.validation_failed }}" = 'true' ]; then
            git commit -m 'Apply C02 audit fixes with validation evidence'
          else
            git commit -m 'Fix C02 persisted replay audit blockers'
          fi
          git push origin HEAD:agent/c02-deterministic-seeds-flags-provenance
