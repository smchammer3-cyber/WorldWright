name: C02 Temporary Source Export

on:
  pull_request:
    branches:
      - WorldWright-new
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source tree
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist -czf /tmp/worldwright-source.tgz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: c02-temporary-source-tree
          path: /tmp/worldwright-source.tgz
          retention-days: 1
