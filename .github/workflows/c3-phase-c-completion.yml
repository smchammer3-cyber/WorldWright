name: C3 Phase C Completion Gate

on:
  pull_request:
    branches:
      - WorldWright-new
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-phase-c-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-c-completion:
    name: Validate Phase C completion and detached Phase M entry
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAUSAL_CONTINENT_OCEAN_C2B_CI_OUT: artifacts/c3-phase-c-completion/fixed-structural-corpus
      CAUSAL_CONTINENT_OCEAN_C3_CI_OUT: artifacts/c3-phase-c-completion

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fixed corpus, live route, artifact, authority, and anti-collapse gates
        run: |
          mkdir -p artifacts/ci-logs artifacts/c3-phase-c-completion
          set -o pipefail
          npx vitest run test/causalContinentOceanStructureResolverCiHarness.spec.ts test/causalContinentOceanStructurePhaseCCompletionCiHarness.spec.ts test/causalContinentOceanStructureC3Artifact.spec.ts 2>&1 | tee artifacts/ci-logs/c3-phase-c-completion.log
          node scripts/ci/validate-c3-live-coverage.mjs 2>&1 | tee -a artifacts/ci-logs/c3-phase-c-completion.log
          cp docs/implementation/phase-c/c3-phase-c-completion-readiness.json artifacts/c3-phase-c-completion/
          cp docs/implementation/phase-c/c3-live-coverage-policy.json artifacts/c3-phase-c-completion/
          cp docs/implementation/PHASE_C3_COMPLETION_AND_PHASE_M_READINESS.md artifacts/c3-phase-c-completion/

      - name: Summarize C3 verdict
        if: always()
        run: |
          {
            echo "## Phase C3 completion and Phase M readiness"
            echo "- Fixed structural fixtures: \`16\`"
            echo "- Live upstream routes: \`7\`"
            echo "- Live anti-collapse: \`>=2 affirmative fixtures and >=1 unresolved region; no role-frequency target\`"
            echo "- Structural holdouts used for calibration: \`no\`"
            echo "- Scientific status: \`PARTIAL\`"
            echo "- Authority mode: \`CAUSAL_SHADOW\`"
            echo "- Physical generator authority: \`LEGACY\`"
            echo "- Phase M entry: \`M1 detached contracts and research only\`"
            echo "- structuralRoleAuthority / structureMaterialCause: \`forbidden\`"
            echo "- Physical or visible output change: \`none\`"
            echo "- Radial geometry and material/surface limitations: \`OPEN\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-phase-c-completion
          path: |
            artifacts/c3-phase-c-completion/
            artifacts/ci-logs/c3-phase-c-completion.log
          if-no-files-found: warn
          retention-days: 30
