name: CI

on:
  pull_request:
    branches: [WorldWright-new]
  push:
    branches: [WorldWright-new]

jobs:
  build-test-diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run build 2>&1 | tee artifacts/ci-logs/build.log

      - name: Test
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run test:run 2>&1 | tee artifacts/ci-logs/test.log

      - name: Generate diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run diagnostics:generate 2>&1 | tee artifacts/ci-logs/diagnostics.log

      - name: Generate visual previews
        if: always()
        run: |
          mkdir -p artifacts/ci-logs
          set -o pipefail
          npm run previews:generate 2>&1 | tee artifacts/ci-logs/previews.log

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldwright-ci-artifacts
          path: artifacts
          if-no-files-found: warn
