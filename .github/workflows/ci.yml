name: CI

on:
  pull_request:
    branches: [WorldWright-new]
  push:
    branches: [WorldWright-new]

jobs:
  build-test-diagnostics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

      - name: Generate diagnostics
        run: npm run diagnostics:generate

      - name: Generate visual previews
        run: npm run previews:generate

      - name: Upload visual previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldwright-generate-previews
          path: artifacts/generate-previews
          if-no-files-found: warn
