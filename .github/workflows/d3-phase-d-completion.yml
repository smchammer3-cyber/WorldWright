name: D3 Phase D Completion Gate

on:
  pull_request:
    branches:
      - WorldWright-new
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-phase-d-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-d-completion:
    name: Validate Phase D completion and detached Phase C entry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAUSAL_PROCESS_FIELD_D3_CI_OUT: artifacts/d3-phase-d-completion

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run D3 completion, distribution, and readiness gates
        run: |
          mkdir -p artifacts/ci-logs artifacts/d3-phase-d-completion
          set -o pipefail
          npx vitest run test/causalProcessFieldProjectionPhaseDCompletionCiHarness.spec.ts test/causalProcessFieldProjectionD3Artifact.spec.ts 2>&1 | tee artifacts/ci-logs/d3-phase-d-completion.log
          cp docs/implementation/phase-d/d3-phase-d-completion-readiness.json artifacts/d3-phase-d-completion/
          cp docs/implementation/PHASE_D3_COMPLETION_AND_PHASE_C_READINESS.md artifacts/d3-phase-d-completion/

      - name: Summarize D3 verdict
        if: always()
        run: |
          {
            echo "## Phase D3 completion and Phase C readiness"
            echo "- Completion fixtures: \`7\`"
            echo "- Positive / threshold / holdout: \`4 / 1 / 2\`"
            echo "- Diagnostic resolutions: \`24×12 / 48×24\`"
            echo "- Phase D scientific status: \`PARTIAL\`"
            echo "- Physical generator authority: \`LEGACY\`"
            echo "- Phase C entry: \`DETACHED_STRUCTURAL_INTERPRETATION_ONLY\`"
            echo "- Physical or visible output change: \`none\`"
            echo "- Radial geometry limitation: \`OPEN / blocks physical promotion\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload D3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d3-phase-d-completion
          path: |
            artifacts/d3-phase-d-completion/
            artifacts/ci-logs/d3-phase-d-completion.log
          if-no-files-found: warn
          retention-days: 30
