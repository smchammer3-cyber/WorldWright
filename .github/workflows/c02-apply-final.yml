name: C02 Apply Final Integration

on:
  push:
    branches:
      - agent/c02-deterministic-seeds-flags-provenance

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-time C02 integration workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c02-deterministic-seeds-flags-provenance
          fetch-depth: 0
      - name: Apply locally verified C02 patch
        shell: bash
        run: |
          printf '%s' '[...truncated for brevity...]' | base64 -d > /tmp/c02-final.patch
          git apply --check /tmp/c02-final.patch
          git apply /tmp/c02-final.patch
          rm .github/workflows/c02-apply-final.yml
      - name: Verify build and focused C02 tests
        run: |
          npm ci
          npm run build
          npx vitest run test/worldRandomKnownVectors.spec.ts test/worldRandomIsolation.spec.ts test/worldRandomScopeEncoding.spec.ts test/worldFeatureFlags.spec.ts test/worldCanonicalHash.spec.ts test/worldProvenance.spec.ts test/worldEntropy.spec.ts test/worldSimDeterminism.spec.ts test/worldSessionMigration.spec.ts test/worldStageHashDeterminism.spec.ts test/worldC02OutputEquivalence.spec.ts test/mathRandomGuard.spec.ts src/core/worldStorage/simBranchRecords.test.ts --maxWorkers=2
      - name: Commit clean C02 integration
        run: |
          git config user.name 'WorldWright C02 Integration'
          git config user.email 'actions@github.com'
          git add -A
          git commit -m 'Complete C02 deterministic foundation'
          git push origin HEAD:agent/c02-deterministic-seeds-flags-provenance
