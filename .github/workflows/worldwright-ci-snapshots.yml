name: WorldWright CI + Jarvis Snapshots

on:
  pull_request:
    branches:
      - WorldWright-new
  push:
    branches:
      - WorldWright-new
  workflow_dispatch:
    inputs:
      export_review_pack:
        description: Generate the full Jarvis Review Pack instead of smoke snapshots only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: worldwright-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  jarvis-snapshots:
    name: Jarvis snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPORT_REVIEW_PACK: ${{ github.event_name == 'workflow_dispatch' && inputs.export_review_pack == true }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Generate Jarvis snapshots
        run: |
          EXTRA_ARGS=""
          if [ "$EXPORT_REVIEW_PACK" = "true" ]; then
            EXTRA_ARGS="--export-review-pack=true"
          fi
          npm run snapshots:jarvis -- --seeds=1040037 --width=256 --viewport=1600x1100 --timeout-ms=30000 --download-timeout-ms=30000 $EXTRA_ARGS

      - name: Upload Jarvis snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-snapshots
          path: artifacts/jarvis-snapshots/
          if-no-files-found: warn
          retention-days: 14
