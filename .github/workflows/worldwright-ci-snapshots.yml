name: WorldWright CI + Jarvis Snapshots

on:
  pull_request:
    branches:
      - WorldWright-new
  push:
    branches:
      - WorldWright-new
  workflow_dispatch:

concurrency:
  group: worldwright-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  jarvis-snapshots:
    name: Jarvis snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Generate Jarvis snapshots
        run: npm run snapshots:jarvis -- --seeds=1040037 --width=96 --viewport=1280x900 --timeout-ms=20000 --download-timeout-ms=20000

      - name: Upload Jarvis snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-snapshots
          path: artifacts/jarvis-snapshots/
          if-no-files-found: warn
